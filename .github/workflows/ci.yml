name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Builds the v3 image for the server (linux/amd64), starts it once to check
  # that it seeds and answers, and pushes it to ghcr.io from main and from
  # version tags. Forks and pull requests build and check but never push.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/oim3690/oim-shop
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --platform linux/amd64 -t oim-shop:ci -f Containerfile .
      - name: Start it once and ask for its health
        run: |
          docker run -d --name smoke -p 8787:8787 -e PUBLIC_URL=http://localhost:8787 oim-shop:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8787/api/health && break; sleep 2; done
          curl -sf http://localhost:8787/api/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8787/orders/10248 | grep -q '<div id="root">'
          docker logs smoke
          docker rm -f smoke
      - name: Push
        if: github.event_name == 'push' && github.repository == 'OIM3690/oim-shop'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $IMAGE:main"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags $IMAGE:${GITHUB_REF_NAME} $IMAGE:latest"; fi
          for tag in $tags; do docker tag oim-shop:ci "$tag" && docker push "$tag"; done
