name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Build, and check the GitHub Pages fallback
        run: npm run build && cmp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'OIM3690/oim-shop'
        with:
          path: web/dist
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Publishes the site at https://oim3690.github.io/oim-shop/ when a version
  # tag (v2, v3, ...) is pushed and its tests pass, so the site always shows
  # the latest release. Pushes to main only run the tests. Forks never deploy.
  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'OIM3690/oim-shop'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
