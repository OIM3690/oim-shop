<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Northwind Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    /* Design tokens: every color, size and space the page uses. Dark mode
       redefines the colors and nothing else. */
    :root {
      --paper: #f6f7f5;
      --surface: #ffffff;
      --ink: #1c2a33;
      --muted: #5a6872;
      --rule: #d8ddda;
      --leader: #a9b3b0;
      --accent: #2c5a78;
      --accent-ink: #ffffff;
      --caution: #a3401f;
      --skeleton: #e6eae7;
      --focus: #2c5a78;

      --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --step-0: 1rem;
      --step-1: 1.25rem;
      --step-2: 1.75rem;
      --step-3: 2.5rem;
      --small: 0.875rem;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2.5rem;
      --radius: 6px;
      --measure: 60rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #11191e;
        --surface: #182229;
        --ink: #e4e9eb;
        --muted: #9eabb3;
        --rule: #2b3740;
        --leader: #4a5a64;
        --accent: #8ab7d6;
        --accent-ink: #0f1a21;
        --caution: #f0a48a;
        --skeleton: #222e36;
        --focus: #8ab7d6;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* A class that sets display would otherwise beat the hidden attribute. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--step-0);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .masthead {
      border-bottom: 1px solid var(--rule);
      background: var(--surface);
    }

    .masthead-inner,
    main {
      max-width: var(--measure);
      margin: 0 auto;
      padding-inline: var(--space-3);
    }

    .masthead-inner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      padding-block: var(--space-3);
    }

    .wordmark {
      margin: 0;
      font-weight: 700;
      font-size: var(--step-1);
      letter-spacing: -0.01em;
    }

    .masthead-note {
      margin: 0;
      color: var(--muted);
      font-size: var(--small);
    }

    main { padding-block: var(--space-5); }

    h1 {
      margin: 0 0 var(--space-4);
      font-size: var(--step-3);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* Search form */
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto;
      gap: var(--space-3);
      align-items: end;
      margin-bottom: var(--space-4);
    }

    .field { display: grid; gap: var(--space-1); }

    label {
      font-size: var(--small);
      font-weight: 600;
    }

    input, select, button { font: inherit; color: inherit; }

    input, select {
      width: 100%;
      min-height: 2.75rem;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--leader);
      border-radius: var(--radius);
      background: var(--surface);
    }

    button {
      min-height: 2.75rem;
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      cursor: pointer;
    }

    button.quiet {
      background: transparent;
      color: var(--accent);
    }

    button:disabled {
      border-color: var(--rule);
      background: transparent;
      color: var(--muted);
      cursor: not-allowed;
    }

    .summary {
      margin: 0 0 var(--space-2);
      color: var(--muted);
      font-size: var(--small);
      min-height: 1.5em;
    }

    /* The price list: each product is one line of a wholesaler's catalogue,
       with a dotted leader running from the name to the price. */
    .price-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 2px solid var(--ink);
    }

    .price-list > li { border-bottom: 1px solid var(--rule); }

    .item {
      display: grid;
      grid-template-columns: minmax(0, max-content) minmax(1.5rem, 1fr) auto 9rem;
      grid-template-areas:
        "name leader price stock"
        "meta meta   .     stock";
      column-gap: var(--space-2);
      width: 100%;
      min-height: 0;
      padding: var(--space-3) var(--space-2);
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 400;
      text-align: left;
    }

    .item:hover { background: var(--surface); }

    .item-name {
      grid-area: name;
      font-weight: 600;
      font-size: var(--step-1);
      line-height: 1.3;
    }

    .item-leader {
      grid-area: leader;
      align-self: end;
      margin-bottom: 0.35em;
      border-bottom: 2px dotted var(--leader);
    }

    .item-price {
      grid-area: price;
      font-size: var(--step-1);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .item-meta {
      grid-area: meta;
      color: var(--muted);
      font-size: var(--small);
    }

    .item-stock {
      grid-area: stock;
      align-self: center;
      justify-self: end;
      color: var(--muted);
      font-size: var(--small);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .item-stock.is-out,
    .item-stock.is-discontinued { color: var(--caution); font-weight: 600; }

    /* Loading placeholders keep the list's shape while data is on its way. */
    .skeleton {
      height: 4.25rem;
      margin: var(--space-2) 0;
      border-radius: var(--radius);
      background: var(--skeleton);
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    .status {
      padding: var(--space-5) var(--space-3);
      border-bottom: 1px solid var(--rule);
      text-align: center;
    }

    .status h2 {
      margin: 0 0 var(--space-2);
      font-size: var(--step-1);
    }

    .status p { margin: 0 0 var(--space-4); color: var(--muted); }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    .pager-label {
      color: var(--muted);
      font-size: var(--small);
      font-variant-numeric: tabular-nums;
    }

    /* Product details */
    dialog {
      width: min(32rem, calc(100vw - 2rem));
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }

    dialog::backdrop { background: rgb(17 25 30 / 0.55); }

    .detail-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-4) var(--space-3);
      border-bottom: 2px solid var(--ink);
    }

    .detail-head h2 {
      margin: 0;
      font-size: var(--step-2);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .detail-list {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: var(--space-2) var(--space-4);
      margin: 0;
      padding: var(--space-4);
    }

    .detail-list dt { color: var(--muted); font-size: var(--small); padding-top: 0.15em; }
    .detail-list dd { margin: 0; font-variant-numeric: tabular-nums; }
    .detail-note { display: block; color: var(--muted); font-size: var(--small); }

    @media (max-width: 40rem) {
      .masthead-inner { flex-direction: column; gap: 0; }
      .filters { grid-template-columns: 1fr; }
      /* A name that wraps would leave a stub of dots, so the leader goes. */
      .item {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "name price"
          "meta stock";
        padding-inline: 0;
      }
      .item-leader { display: none; }
      .item-stock { align-self: start; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="wordmark">Northwind Traders</p>
      <p class="masthead-note">Sales system</p>
    </div>
  </header>

  <main>
    <h1>Products</h1>

    <form class="filters" id="filters" role="search">
      <div class="field">
        <label for="name">Product name</label>
        <input id="name" name="name" type="search" autocomplete="off" placeholder="For example, chai">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">All categories</option>
        </select>
      </div>
      <button type="submit">Search</button>
    </form>

    <p class="summary" id="summary" aria-live="polite"></p>

    <section id="results" aria-busy="false" aria-label="Products">
      <ol class="price-list" id="product-list"></ol>

      <div class="status" id="status" hidden>
        <h2 id="status-title"></h2>
        <p id="status-text"></p>
        <button type="button" id="status-action"></button>
      </div>
    </section>

    <nav class="pager" id="pager" aria-label="Pages" hidden>
      <button type="button" class="quiet" id="previous">Previous</button>
      <span class="pager-label" id="page-label"></span>
      <button type="button" class="quiet" id="next">Next</button>
    </nav>
  </main>

  <dialog id="detail" aria-labelledby="detail-name">
    <div class="detail-head">
      <h2 id="detail-name"></h2>
      <button type="button" class="quiet" id="detail-close">Close</button>
    </div>
    <dl class="detail-list">
      <dt>Category</dt>
      <dd><span id="detail-category"></span><span class="detail-note" id="detail-category-note"></span></dd>
      <dt>Supplier</dt>
      <dd id="detail-supplier"></dd>
      <dt>Quantity per unit</dt>
      <dd id="detail-quantity"></dd>
      <dt>Unit price</dt>
      <dd id="detail-price"></dd>
      <dt>Units in stock</dt>
      <dd id="detail-stock"></dd>
      <dt>Status</dt>
      <dd id="detail-status"></dd>
    </dl>
  </dialog>

  <!-- One product line. JavaScript copies it for each product and fills the
       spans with textContent, so a name can never be read as HTML. -->
  <template id="item-template">
    <li>
      <button type="button" class="item">
        <span class="item-name"></span>
        <span class="item-leader" aria-hidden="true"></span>
        <span class="item-price"></span>
        <span class="item-meta"></span>
        <span class="item-stock"></span>
      </button>
    </li>
  </template>

  <script>
    const API = "https://oim.zhili.dev/shop";
    const PER_PAGE = 20;

    // What the visitor asked for. Every request is built from this object.
    const query = { name: "", categoryId: "", page: 1 };

    // category_id -> { name, description }, filled once from /shop/categories.
    const categories = new Map();

    // Lets a new request cancel the one before it, so a slow old response
    // can never replace a newer one on screen.
    let inFlight = null;

    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
    const count = new Intl.NumberFormat("en-US");

    const el = (id) => document.getElementById(id);
    const form = el("filters");
    const nameInput = el("name");
    const categorySelect = el("category");
    const list = el("product-list");
    const results = el("results");
    const summary = el("summary");
    const pager = el("pager");
    const dialog = el("detail");

    class ApiError extends Error {
      constructor(status) {
        super(`oim-api answered ${status}`);
        this.status = status;
      }
    }

    async function getJson(path, params = {}, signal) {
      const url = new URL(API + path);
      for (const [key, value] of Object.entries(params)) {
        if (value !== "" && value !== undefined) url.searchParams.set(key, value);
      }
      const response = await fetch(url, { signal });
      if (!response.ok) throw new ApiError(response.status);
      return response.json();
    }

    async function loadCategories() {
      try {
        for (const category of await getJson("/categories")) {
          categories.set(String(category.category_id), category);
          categorySelect.add(new Option(category.name, category.category_id));
        }
      } catch {
        // The list still works without the filter; the menu keeps "All categories".
      }
    }

    async function loadProducts() {
      inFlight?.abort();
      inFlight = new AbortController();
      showLoading();
      try {
        const data = await getJson(
          "/products",
          { name: query.name, category: query.categoryId, page: query.page, per_page: PER_PAGE },
          inFlight.signal,
        );
        showProducts(data);
      } catch (error) {
        if (error.name === "AbortError") return;
        showError(error);
      }
    }

    function showLoading() {
      results.setAttribute("aria-busy", "true");
      summary.textContent = "Loading products…";
      el("status").hidden = true;
      list.replaceChildren(
        ...Array.from({ length: 5 }, () => {
          const placeholder = document.createElement("li");
          placeholder.className = "skeleton";
          placeholder.setAttribute("aria-hidden", "true");
          return placeholder;
        }),
      );
    }

    function showProducts({ items, pagination }) {
      results.setAttribute("aria-busy", "false");
      summary.textContent = describeResults(pagination.total);

      if (items.length === 0) {
        list.replaceChildren();
        pager.hidden = true;
        showStatus({
          title: `No products${describeQuery()}.`,
          text: "Check the spelling, or search all categories.",
          action: "Clear search",
          onAction: clearSearch,
        });
        return;
      }

      list.replaceChildren(...items.map(renderItem));
      pager.hidden = pagination.pages <= 1;
      el("previous").disabled = !pagination.has_prev;
      el("next").disabled = !pagination.has_next;
      el("page-label").textContent = `Page ${pagination.page} of ${pagination.pages}`;
    }

    function showError(error) {
      results.setAttribute("aria-busy", "false");
      summary.textContent = "";
      list.replaceChildren();
      pager.hidden = true;
      const tooMany = error instanceof ApiError && error.status === 429;
      showStatus({
        title: tooMany ? "Too many requests for now." : "The product list did not load.",
        text: tooMany
          ? "The API limits how often one network can ask. Wait a minute, then try again."
          : "Check your internet connection, then try again.",
        action: "Try again",
        onAction: loadProducts,
      });
    }

    function showStatus({ title, text, action, onAction }) {
      el("status-title").textContent = title;
      el("status-text").textContent = text;
      el("status-action").textContent = action;
      el("status-action").onclick = onAction;
      el("status").hidden = false;
    }

    function renderItem(product) {
      const item = el("item-template").content.firstElementChild.cloneNode(true);
      item.querySelector(".item-name").textContent = product.name;
      item.querySelector(".item-price").textContent = money.format(product.unit_price_dollars);
      item.querySelector(".item-meta").textContent = `${product.category}, ${product.quantity_per_unit}`;

      const stock = item.querySelector(".item-stock");
      stock.textContent = stockLabel(product);
      stock.classList.toggle("is-discontinued", product.discontinued);
      stock.classList.toggle("is-out", !product.discontinued && product.units_in_stock === 0);

      item.querySelector("button").addEventListener("click", () => openDetail(product));
      return item;
    }

    function stockLabel(product) {
      if (product.discontinued) return "Discontinued";
      if (product.units_in_stock === 0) return "Out of stock";
      return `${count.format(product.units_in_stock)} in stock`;
    }

    function describeResults(total) {
      const noun = total === 1 ? "product" : "products";
      return `${count.format(total)} ${noun}${describeQuery()}`;
    }

    // " matching “chai” in Beverages", or "" when nothing is filtered.
    function describeQuery() {
      let text = "";
      if (query.name) text += ` matching “${query.name}”`;
      if (query.categoryId) text += ` in ${categories.get(query.categoryId)?.name ?? "this category"}`;
      return text;
    }

    function openDetail(product) {
      const category = [...categories.values()].find((c) => c.name === product.category);
      el("detail-name").textContent = product.name;
      el("detail-category").textContent = product.category;
      el("detail-category-note").textContent = category?.description ?? "";
      el("detail-supplier").textContent = product.supplier;
      el("detail-quantity").textContent = product.quantity_per_unit;
      el("detail-price").textContent = money.format(product.unit_price_dollars);
      el("detail-stock").textContent = count.format(product.units_in_stock);
      el("detail-status").textContent = product.discontinued ? "Discontinued" : "Available to order";
      dialog.showModal();
    }

    function clearSearch() {
      form.reset();
      query.name = "";
      query.categoryId = "";
      query.page = 1;
      loadProducts();
      nameInput.focus();
    }

    function goToPage(page) {
      query.page = page;
      loadProducts();
      results.scrollIntoView({ block: "start" });
    }

    // A new search always starts again at page 1.
    function search() {
      query.name = nameInput.value.trim();
      query.categoryId = categorySelect.value;
      query.page = 1;
      loadProducts();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      search();
    });
    categorySelect.addEventListener("change", search);
    el("previous").addEventListener("click", () => goToPage(query.page - 1));
    el("next").addEventListener("click", () => goToPage(query.page + 1));
    el("detail-close").addEventListener("click", () => dialog.close());

    loadCategories();
    loadProducts();
  </script>
</body>
</html>
